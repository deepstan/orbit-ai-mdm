<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MDM — Steward Console</title>
<style>
  :root {
    --bg: #0F1720;
    --panel: #16212C;
    --panel-alt: #1C2833;
    --border: #2A3A48;
    --text: #E6EDF3;
    --text-dim: #8B9AAB;
    --accent: #3FA9F5;
    --accent-dim: #1E5A82;
    --good: #4CBB8A;
    --warn: #E0A93E;
    --bad: #D96C6C;
    --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  header {
    padding: 20px 28px 0 28px;
    border-bottom: 1px solid var(--border);
  }
  .header-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding-bottom: 16px;
  }
  header h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header .sub { color: var(--text-dim); font-size: 13px; }
  .stats { display: flex; gap: 22px; font-family: var(--mono); font-size: 13px; }
  .stats span b { color: var(--text); font-weight: 600; }
  .stats span { color: var(--text-dim); }
  .tabs {
    display: flex;
    gap: 4px;
  }
  .tab {
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    font-family: var(--sans);
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .count {
    font-family: var(--mono);
    font-size: 11px;
    margin-left: 6px;
    color: var(--text-dim);
  }
  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 28px;
  }
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-dim);
  }
  .empty .big { font-size: 15px; color: var(--text); margin-bottom: 6px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    background: var(--panel-alt);
    border-bottom: 1px solid var(--border);
  }
  .score {
    font-family: var(--mono);
    font-size: 13px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
  }
  .score.high { background: rgba(224,169,62,0.15); color: var(--warn); }
  .match-type {
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono);
    margin-left: 8px;
  }
  .reasons {
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--mono);
    padding: 10px 18px 0 18px;
  }
  .reasons ul { margin: 4px 0 0 0; padding-left: 18px; }
  .pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    margin-top: 12px;
  }
  .rec {
    background: var(--panel);
    padding: 14px 18px;
  }
  .rec .src {
    font-size: 11px;
    text-transform: lowercase;
    color: var(--accent);
    font-family: var(--mono);
    margin-bottom: 8px;
  }
  .rec .field { display: flex; gap: 8px; font-size: 13px; padding: 2px 0; }
  .rec .field .k { color: var(--text-dim); width: 100px; flex-shrink: 0; text-transform: capitalize; }
  .rec .field .v { color: var(--text); word-break: break-word; }
  .actions {
    display: flex;
    gap: 10px;
    padding: 14px 18px 18px 18px;
  }
  button.action-btn {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .confirm { background: var(--good); color: #06241a; }
  .confirm:hover { filter: brightness(1.08); }
  .reject { background: transparent; border-color: var(--border); color: var(--text-dim); }
  .reject:hover { color: var(--bad); border-color: var(--bad); }
  section.golden { margin-top: 42px; }
  section.golden h2 {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 600;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--text-dim); font-weight: 500; padding: 6px 10px; font-size: 12px; }
  td { padding: 8px 10px; border-top: 1px solid var(--border); }
  td.id { font-family: var(--mono); color: var(--text-dim); font-size: 11px; }
  .toast {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel-alt);
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
.contrib{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}.contrib th,.contrib td{padding:3px 6px;text-align:left;border-bottom:1px solid #e5e7eb}.contrib .disagree td{color:#b91c1c}.contrib .missing td{color:#9ca3af}.contrib .pts{text-align:right;font-variant-numeric:tabular-nums}
  /* the audit panel */
  .audits { margin-top: 32px; }
  .audit-summary { background: var(--panel, #1a1d24); border: 1px solid var(--border, #2a2f3a); border-radius: 8px; padding: 12px 16px; margin-bottom: 14px; font-size: 13px; line-height: 1.7; }
  .audit-summary b { color: var(--text); }
  .audit-summary .alert { color: var(--warn); }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: 8px; border: 1px solid var(--border, #2a2f3a); }
  .badge.model { color: var(--warn); border-color: var(--warn); }
  .more { text-align: center; margin: 14px 0; }
  .note { font-size: 12px; color: var(--muted, #8a93a6); }
  /* the assistant's suggestion: advisory, and CLOSED until a steward chooses to read it. "merge" and "not a match" look the same on purpose: it must not nudge. */
  details.suggest { margin: 12px 18px 0 18px; border: 1px dashed var(--border); border-radius: 6px; background: var(--panel-alt); }
  details.suggest > summary { cursor: pointer; padding: 8px 12px; font-size: 12px; color: var(--text-dim); list-style: none; }
  details.suggest > summary::-webkit-details-marker { display: none; }
  details.suggest > summary::before { content: '\25B8  '; }
  details.suggest[open] > summary::before { content: '\25BE  '; }
  details.suggest[open] > summary { color: var(--text); border-bottom: 1px dashed var(--border); }
  .suggest-body { padding: 4px 12px 10px 12px; font-size: 13px; }
  .opinion { padding: 10px 0; border-top: 1px solid var(--border); }
  .opinion:first-child { border-top: 0; }
  .verdict { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: 600; font-size: 12px; border: 1px solid var(--accent-dim); color: var(--accent); background: rgba(63,169,245,0.08); }
  .verdict.unsure { border-color: var(--warn); color: var(--warn); background: rgba(224,169,62,0.08); }
  .opinion .conf { font-family: var(--mono); font-size: 12px; color: var(--text-dim); margin-left: 8px; }
  .opinion ul { margin: 6px 0 0 0; padding-left: 18px; }
  .opinion .meta { font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-top: 6px; }
  .suggest-note { font-size: 11px; color: var(--text-dim); margin-top: 8px; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <h1>MDM — Steward Console</h1>
      <div class="sub">Phase 1+2 · multi-domain</div>
    </div>
    <div class="stats">
      <span>Pending review <b id="stat-pending">–</b></span>
      <span>Golden records <b id="stat-entities">–</b></span>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <div id="queue"></div>

  <section class="audits">
    <h2>Audit: are these automatic merges right?</h2>
    <div id="audit-summary"></div>
    <div id="audits"></div>
  </section>

  <section class="golden">
    <h2>Golden records</h2>
    <div id="entities-container"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const API = '';
let DOMAINS = [];   // filled from /v1/domains at startup, so customer-defined domains get tabs too
// Which attributes to show as the "identity" columns in the golden-records
// table per domain -- everything else still shows in the review-queue
// record cards (which render ALL attributes generically), this is just
// for a readable summary table.
const SUMMARY_FIELDS = {
  customer: ['first_name', 'last_name', 'email', 'city'],
  product:  ['product_name', 'brand', 'sku', 'category'],
  vendor:   ['company_name', 'tax_id', 'contact_email', 'city'],
};

let currentDomain = 'customer';

// Everything that comes from ingested data (values, field names, source names, match reasons) is
// untrusted: it is whatever a source system sent. It must never reach innerHTML unescaped.
const esc = (v) => String(v ?? '').replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function loadDomains() {
  const list = await fetchJSON('/v1/domains');
  DOMAINS = list.map(d => ({
    id: d.domain,
    label: d.domain.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()),
    fields: d.fields,
  }));
  if (!DOMAINS.some(d => d.id === currentDomain) && DOMAINS.length) currentDomain = DOMAINS[0].id;
}

async function fetchJSON(url, opts) {
  const res = await fetch(API + url, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function renderTabs(counts) {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = DOMAINS.map(d => `
    <button class="tab ${d.id === currentDomain ? 'active' : ''}" onclick="switchDomain('${d.id}')">
      ${esc(d.label)}<span class="count">${counts[d.id] ?? ''}</span>
    </button>
  `).join('');
}

function switchDomain(domain) {
  currentDomain = domain;
  suggestionHints = new Set(); suggestionsLoaded = {}; suggestionErrors = new Set(); suggestionsOpen = new Set(); suggestionsViewed = new Set(); suggestionStats = null;
  resetPages();
  loadAll();
}

// Renders EVERY attribute a record has, generically -- no hardcoded field
// names, so this works identically for customer/product/vendor/any future
// domain without UI changes.
function renderRecord(rec) {
  if (!rec) return '<div class="rec"><span class="src">unknown</span></div>';
  const fields = Object.entries(rec.attributes || {})
    .filter(([, v]) => v !== null && v !== undefined && v !== '')
    .map(([k, v]) => `<div class="field"><span class="k">${esc(k.replace(/_/g, ' '))}</span><span class="v">${esc(v)}</span></div>`)
    .join('');
  return `
    <div class="rec">
      <div class="src">${esc(rec.source_system)}</div>
      ${fields}
    </div>`;
}

// Per-field evidence behind a score: the "why" a steward needs, as numbers, not just sentences.
function renderContributions(list) {
  if (!list || !list.length) return '';
  const rows = list.map(c => {
    const pts = Number(c.points);
    const sim = (c.similarity === null || c.similarity === undefined) ? '—' : Number(c.similarity).toFixed(2);
    return `<tr class="${esc(c.state)}"><td>${esc(String(c.field).replace(/_/g, ' '))}</td><td>${esc(c.state)}</td>` +
           `<td>${esc(sim)}</td><td class="pts">${esc((pts >= 0 ? '+' : '') + pts.toFixed(2))}</td></tr>`;
  }).join('');
  return `<table class="contrib"><thead><tr><th>field</th><th>evidence</th><th>similarity</th><th>points</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// ---------------------------------------------------------------------------------------------------------------------------------
// The assistant's suggestions (docs/agent-runner.md). ADVISORY: a model's recorded opinion about an item, which changed nothing and can be wrong.
//  * It is shown only when a steward OPENS it. Until then the page holds nothing of what it says (only that one exists), so "closed" means "not seen".
//  * Whether it was opened before the decision is sent with the decision (suggestion_viewed), so that agreement with the assistant can be measured on the decisions it did NOT influence.
//  * It is deliberately plain: merge and not-a-match look the same, there is no "accept" button, and the two real buttons are not touched by it.
//  * What it says was written by a model reading source data, so it is untrusted like any other data and goes through esc().
// ---------------------------------------------------------------------------------------------------------------------------------
let suggestionHints = new Set();      // candidate ids for which an opinion exists (known without reading it)
let suggestionsLoaded = {};           // candidate id -> its opinions, fetched only once a steward has opened the panel
let suggestionErrors = new Set();
let suggestionsOpen = new Set();      // panels open right now (kept across the 8-second refresh)
let suggestionsViewed = new Set();    // opened at least once on this page: the decision then says suggestion_viewed: true
let suggestionStats = null;
const VERDICTS = { confirm: 'Same entity: merge', reject: 'Not a match', needs_human: "Can't tell: needs a person" };

function renderOpinion(r) {
  const label = VERDICTS[r.recommendation] || r.recommendation;
  const conf = Number(r.confidence);
  const reasons = (r.reasons || []).map(x => `<li>${esc(x)}</li>`).join('');
  const meta = [r.agent, r.model, r.prompt_version, r.created_at].filter(x => x).map(esc).join(' \u00B7 ');
  return `<div class="opinion">
      <span class="verdict ${r.recommendation === 'needs_human' ? 'unsure' : ''}">${esc(label)}</span><span class="conf">${Number.isFinite(conf) ? esc(Math.round(conf * 100)) + '% sure' : ''}</span>
      ${reasons ? `<ul>${reasons}</ul>` : ''}
      <div class="meta">${meta}</div>
    </div>`;
}

function suggestionFooter() {
  let track = '';
  if (suggestionStats && suggestionStats.decided > 0) {
    track = ` So far its suggestions have matched stewards' decisions in ${esc(suggestionStats.agreed)} of ${esc(suggestionStats.decided)} decided cases` +
            (suggestionStats.decided < 30 ? ' (too few to say how reliable it is).' : '.');
  }
  return `<div class="suggest-note">An AI model's opinion, recorded for you to consider. It changed nothing and it can be wrong. You decide.${track}</div>`;
}

function renderSuggestion(candidateId) {
  if (!suggestionHints.has(candidateId) && !suggestionsLoaded[candidateId]) return '';
  const open = suggestionsOpen.has(candidateId);
  let body = '';
  if (open) {                              // the text is put in the page ONLY for a panel that is open
    const items = suggestionsLoaded[candidateId];
    if (suggestionErrors.has(candidateId)) body = '<div class="note">Could not load the suggestion.</div>';
    else if (!items) body = '<div class="note">Loading\u2026</div>';
    else body = items.length ? items.map(renderOpinion).join('') + suggestionFooter() : '<div class="note">There is no suggestion for this item now.</div>';
  }
  return `<details class="suggest" data-id="${esc(candidateId)}" ${open ? 'open' : ''} ontoggle="onSuggestionToggle(this)">
      <summary>Assistant's suggestion<span class="badge">available &middot; advisory</span></summary><div class="suggest-body">${body}</div></details>`;
}

// Fires when a steward opens or closes a panel (and, in some browsers, once for a panel that was drawn already open: it must therefore do nothing the second time).
function onSuggestionToggle(el) {
  const id = el.dataset.id;
  if (el.open) {
    suggestionsOpen.add(id);
    suggestionsViewed.add(id);
    if (!(id in suggestionsLoaded) && !suggestionErrors.has(id)) return loadSuggestion(id);
  } else {
    suggestionsOpen.delete(id);            // closing does not un-see it: it stays in suggestionsViewed
  }
}

async function loadSuggestion(id) {
  try {
    const data = await fetchJSON(`/v1/${currentDomain}/review-queue/${encodeURIComponent(id)}/recommendations`);
    suggestionsLoaded[id] = (data && data.items) || [];
    if (!suggestionStats) {
      try {
        const st = await fetchJSON(`/v1/${currentDomain}/recommendations/stats`);
        suggestionStats = { decided: st.decided, agreed: st.agreed };
      } catch (e) { suggestionStats = { decided: 0, agreed: 0 }; }
    }
  } catch (e) {
    suggestionErrors.add(id);
  }
  renderQueue();
}

async function refreshSuggestionHints() {
  let ids;
  try {
    const page = await fetchJSON(`/v1/${currentDomain}/recommendations?outcome=open&limit=200`);
    ids = ((page && page.items) || []).map(r => r.candidate_id);
  } catch (e) { return; }                // could not ask: keep what is known (a panel someone is reading must not vanish because of one failed request). No suggestions at all is an empty list, not an error
  const same = ids.length === suggestionHints.size && ids.every(i => suggestionHints.has(i));
  suggestionHints = new Set(ids);
  if (!same) renderQueue();
}

function renderCandidate(c) {
  const reasonsHtml = c.reasons.map(r => `<li>${esc(r)}</li>`).join('');
  return `
    <div class="card" data-id="${c.candidate_id}">
      <div class="card-head">
        <div>Possible duplicate<span class="match-type">${esc(c.match_type)}</span></div>
        <div class="score high">${(c.score * 100).toFixed(0)}% match</div>
      </div>
      <div class="reasons">Why: <ul>${reasonsHtml}</ul></div>
      ${renderContributions(c.contributions)}
      <div class="pair">
        ${renderRecord(c.record_a)}
        ${renderRecord(c.record_b)}
      </div>
      ${renderSuggestion(c.candidate_id)}
      <div class="actions">
        <button class="action-btn confirm" onclick="resolve('${c.candidate_id}', 'confirm')">Confirm match &amp; merge</button>
        <button class="action-btn reject" onclick="resolve('${c.candidate_id}', 'reject')">Not a match</button>
      </div>
    </div>`;
}

async function resolve(candidateId, decision) {
  try {
    // true: the steward opened the suggestion before deciding; false: one was there and they did not look; left out: there was none. The server keeps it with the outcome.
    const payload = {decision};
    if (suggestionsViewed.has(candidateId)) payload.suggestion_viewed = true;
    else if (suggestionHints.has(candidateId)) payload.suggestion_viewed = false;
    await fetchJSON(`/v1/${currentDomain}/review-queue/${candidateId}/resolve`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)   // who decided is the signed-in key's name, decided by the server
    });
    for (const set of [suggestionHints, suggestionsOpen, suggestionsViewed, suggestionErrors]) set.delete(candidateId);
    delete suggestionsLoaded[candidateId];
    showToast(decision === 'confirm' ? 'Merged into golden record' : 'Marked as not a match');
    resetPages();   // a decision changes what is on every page: start again from the first
    await loadAll();
  } catch (e) {
    showToast('Error: ' + e.message);
  }
}

// The two long lists are shown a page at a time. The page refreshes itself every 8 seconds: while someone has asked for more pages, the refresh leaves those lists alone
// (it would otherwise collapse them under their eyes); a decision, or switching domain, starts them again from the first page.
let queueLoaded = [], queueCursor = null, queueTotal = 0, queueExpanded = false;
let entitiesLoaded = [], entitiesCursor = null, entitiesExpanded = false;

function resetPages() {
  queueLoaded = []; queueCursor = null; queueTotal = 0; queueExpanded = false;
  entitiesLoaded = []; entitiesCursor = null; entitiesExpanded = false;
}

function renderQueue() {
  const queueEl = document.getElementById('queue');
  document.getElementById('stat-pending').textContent = queueTotal;
  if (queueLoaded.length === 0) {
    queueEl.innerHTML = `<div class="empty"><div class="big">Review queue is empty</div>All incoming ${esc(currentDomain)} records were either auto-merged or had no plausible match.</div>`;
    return;
  }
  const more = queueCursor
    ? `<div class="more"><button class="action-btn confirm" onclick="loadQueue(true)">Show more (${esc(Math.max(0, queueTotal - queueLoaded.length))} more waiting)</button></div>` : '';
  queueEl.innerHTML = queueLoaded.map(renderCandidate).join('') + more;
}

async function loadQueue(more = false) {
  if (!more && queueExpanded) return queueTotal;   // see above: leave what someone is reading alone
  const page = await fetchJSON(`/v1/${currentDomain}/review-queue` + (more && queueCursor ? `?cursor=${encodeURIComponent(queueCursor)}` : ''));
  const items = (page && page.items) || [];
  queueLoaded = more ? queueLoaded.concat(items) : items;
  queueCursor = (page && page.next_cursor) || null;
  queueTotal = (page && page.total !== undefined) ? page.total : queueLoaded.length;
  if (more) queueExpanded = true;
  renderQueue();
  return queueTotal;
}

function renderEntities() {
  document.getElementById('stat-entities').textContent = entitiesLoaded.length + (entitiesCursor ? '+' : '');
  const container = document.getElementById('entities-container');
  const domainFields = (DOMAINS.find(d => d.id === currentDomain) || { fields: [] }).fields;
  const preferred = (SUMMARY_FIELDS[currentDomain] || []).filter(f => domainFields.includes(f));
  const summaryFields = preferred.length ? preferred : domainFields.slice(0, 4);

  if (entitiesLoaded.length === 0) {
    container.innerHTML = `<div class="empty">No ${esc(currentDomain)} golden records yet.</div>`;
    return;
  }

  const headerRow = summaryFields.map(f => `<th>${esc(f.replace(/_/g, ' '))}</th>`).join('');
  const rows = entitiesLoaded.map(e => {
    const cells = summaryFields.map(f => `<td>${esc(e.attributes[f] || '—')}</td>`).join('');
    return `<tr><td class="id">${esc(e.entity_id.slice(0, 12))}…</td>${cells}<td>${esc(e.source_record_ids.length)}</td></tr>`;
  }).join('');
  const more = entitiesCursor ? `<div class="more"><button class="action-btn confirm" onclick="loadEntities(true)">Show more</button></div>` : '';

  container.innerHTML = `
    <table>
      <thead><tr><th>ID</th>${headerRow}<th>Sources</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>` + more;
}

async function loadEntities(more = false) {
  if (!more && entitiesExpanded) return;
  const page = await fetchJSON(`/v1/${currentDomain}/entities?status=active` + (more && entitiesCursor ? `&cursor=${encodeURIComponent(entitiesCursor)}` : ''));
  const items = (page && page.items) || [];
  entitiesLoaded = more ? entitiesLoaded.concat(items) : items;
  entitiesCursor = (page && page.next_cursor) || null;
  if (more) entitiesExpanded = true;
  renderEntities();
}

// ---- Audit: a random sample of the system's AUTOMATIC merges, for a person to say whether each is right. The model's promotions come first.
const pct = (v) => (v === null || v === undefined) ? '–' : (Number(v) * 100).toFixed(2) + '%';

function renderAuditSummary(s) {
  if (!s || !s.strata) return '';
  const row = (label, k) => {
    const t = s.strata[k] || {};
    return `<div>${esc(label)}: <b>${esc(t.audited ?? 0)}</b> checked of ${esc(t.merges ?? 0)}, <b>${esc(t.wrong ?? 0)}</b> wrong (${esc(pct(t.estimate))}, plausibly ${esc(pct(t.lower_bound))} to ${esc(pct(t.upper_bound))})</div>`;
  };
  const sc = s.scorer || {};
  const model = !sc.present ? 'no learned model for this domain'
    : sc.state === 'rolled_back' ? `<span class="alert">ROLLED BACK: ${esc(sc.reason)}. Promotion is off until an administrator resets it.</span>`
    : sc.promotion_live ? 'live: it promotes pairs out of review' : 'trained, not live (it only proposes)';
  return `<div class="audit-summary"><div><b>${esc(s.waiting ?? 0)}</b> waiting for a person. Target: at most ${esc(pct(s.target))} wrong.</div>` +
         row('Rule score merges', 'rule') + row('Model promotions', 'promoted') + `<div>Model: ${model}</div></div>`;
}

function renderAudit(a) {
  const u = a.unmerge || {};
  const reasonsHtml = (a.reasons || []).map(r => `<li>${esc(r)}</li>`).join('');
  const id = esc(a.candidate_id);
  const unmergeBtn = u.possible
    ? `<button class="action-btn reject" onclick="auditVerdict('${id}', 'wrong', true)">Wrong: unmerge (${esc(u.moves)} record(s) move out)</button>`
    : `<span class="note">Cannot be unmerged on its own: ${esc(u.why || '')}</span>`;
  return `
    <div class="card" data-id="${id}">
      <div class="card-head">
        <div>Automatic merge<span class="badge ${a.made_by === 'model' ? 'model' : ''}">${a.made_by === 'model' ? 'promoted by the model' : 'rule score'}</span><span class="match-type">${esc(a.match_type)}</span></div>
        <div class="score high">${(Number(a.score) * 100).toFixed(0)}% match</div>
      </div>
      <div class="reasons">Why it was merged: <ul>${reasonsHtml}</ul></div>
      ${renderContributions(a.contributions)}
      <div class="pair">
        ${renderRecord(a.record_a)}
        ${renderRecord(a.record_b)}
      </div>
      <div class="actions">
        <button class="action-btn confirm" onclick="auditVerdict('${id}', 'correct', false)">Correct: same entity</button>
        <button class="action-btn reject" onclick="auditVerdict('${id}', 'wrong', false)">Wrong (only record it)</button>
        ${unmergeBtn}
      </div>
    </div>`;
}

async function auditVerdict(candidateId, verdict, unmerge) {
  try {
    const r = await fetchJSON(`/v1/${currentDomain}/audits/${candidateId}/verdict`, {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({verdict, unmerge})
    });
    if (r.unmerge && r.unmerge.ok) showToast(`Recorded as wrong; ${r.unmerge.moved} record(s) moved to a new entity`);
    else if (r.unmerge) showToast('Recorded as wrong, but not unmerged: ' + r.unmerge.why);
    else showToast(verdict === 'correct' ? 'Recorded as correct' : 'Recorded as wrong');
    lastAuditSignature = null;
    await loadAll();
  } catch (e) {
    showToast('Error: ' + e.message);
  }
}

let lastAuditSignature = null;   // the page refreshes itself: do not redraw (and lose someone's place) when nothing changed
async function loadAudits() {
  const data = await fetchJSON(`/v1/${currentDomain}/audits`);
  const items = (data && data.items) || [];
  const signature = currentDomain + JSON.stringify(items.map(i => i.candidate_id)) + JSON.stringify(data && data.summary);
  if (signature === lastAuditSignature) return;
  lastAuditSignature = signature;
  document.getElementById('audit-summary').innerHTML = renderAuditSummary(data && data.summary);
  document.getElementById('audits').innerHTML = items.length
    ? items.map(renderAudit).join('')
    : `<div class="empty"><div class="big">Nothing waiting for an audit</div>A random sample of automatic merges shows up here as they are made.</div>`;
}

async function loadAll() {
  const pendingCount = await loadQueue();
  await refreshSuggestionHints();
  await loadEntities();
  try { await loadAudits(); } catch (e) { /* a role that may not audit just sees no panel content */ }

  // Fetch pending counts for every domain so the tab bar shows all three
  // at once without switching -- accumulate into one object before the
  // final render so earlier counts aren't clobbered.
  const counts = { [currentDomain]: pendingCount };
  for (const d of DOMAINS) {
    if (d.id === currentDomain) continue;
    try {
      const page = await fetchJSON(`/v1/${d.id}/review-queue?limit=1`);   // only the count is wanted: ask for one item, read `total`
      counts[d.id] = (page && page.total !== undefined) ? page.total : ((page && page.items) || []).length;
    } catch (e) { /* ignore */ }
  }
  renderTabs(counts);
}

renderTabs({});
loadDomains().then(loadAll).catch(e => showToast('Error: ' + e.message));
setInterval(loadAll, 8000);
</script>
